services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/static:/var/www/static:ro
    depends_on:
      - fastapi
      - n8n
      - pgadmin
    networks:
      - app-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: priority-desk-api
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./.env:/.env:rw
      - ./setup:/setup:rw
      - ./prompts:/prompts:ro
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_URL=${LLM_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_URL=${EMBEDDING_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDMINE_API_KEY=${REDMINE_API_KEY}
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - |
        for f in /setup/credentials/*.json; do
          [ -f "$$f" ] && n8n import:credentials --input "$$f" --force;
        done &&
        for f in /setup/workflow/*.json; do
          [ -f "$$f" ] && {
            n8n import:workflow --input "$$f" --force;
            ID=$$(node -e "try{const fs=require('fs');console.log(JSON.parse(fs.readFileSync('$$f')).id)}catch(e){}");
            [ -n "$$ID" ] && n8n publish:workflow --id="$$ID";
          };
        done &&
        exec n8n start
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./setup/credentials:/setup/credentials:ro
      - ./setup/workflow:/setup/workflow:ro
    depends_on:
      - postgres
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_:/var/lib/postgresql/data
      - ./setup/init-db:/docker-entrypoint-initdb.d
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@local.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redmine:
    image: redmine:6.1
    container_name: redmine
    environment:
      - REDMINE_DB_POSTGRES=postgres
      - REDMINE_DB_DATABASE=redmine
      - REDMINE_DB_USERNAME=redmine_user
      - REDMINE_DB_PASSWORD=redmine_password
      - REDMINE_SECRET_KEY_BASE=supersecretkeyformine
    ports:
      - "3000:3000"
    volumes:
      - redmine_:/usr/src/redmine/files
    depends_on:
      - postgres
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_:
  redmine_:

networks:
  app-network:
    driver: bridge