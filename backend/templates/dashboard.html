{% extends "base.html" %}

{% block page_title %}Обзор системы{% endblock %}

{% block content %}
<!-- Карточки статистики -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <!-- Card 1 -->
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="flex justify-between items-start">
            <div>
                <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Обработано задач</p>
                <h3 class="text-2xl font-bold text-slate-800 mt-1">1,248</h3>
            </div>
            <div class="p-2 bg-blue-50 rounded-lg text-blue-600"><i class="ph ph-clipboard-text text-xl"></i></div>
        </div>
        <p class="text-xs text-emerald-600 mt-2 flex items-center gap-1"><i class="ph ph-trend-up"></i> +12% за неделю</p>
    </div>

    <!-- Card 2 -->
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="flex justify-between items-start">
            <div>
                <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Точность LLM</p>
                <h3 class="text-2xl font-bold text-slate-800 mt-1">87.4%</h3>
            </div>
            <div class="p-2 bg-purple-50 rounded-lg text-purple-600"><i class="ph ph-brain text-xl"></i></div>
        </div>
        <p class="text-xs text-slate-400 mt-2">На основе 450 ручных правок</p>
    </div>

    <!-- Card 3 -->
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="flex justify-between items-start">
            <div>
                <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Активные сферы</p>
                <h3 class="text-2xl font-bold text-slate-800 mt-1">4</h3>
            </div>
            <div class="p-2 bg-orange-50 rounded-lg text-orange-600"><i class="ph ph-globe text-xl"></i></div>
        </div>
        <p class="text-xs text-slate-400 mt-2">ЖКХ, IT, HR, Общие</p>
    </div>

    <!-- Card 4 -->
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div class="flex justify-between items-start">
            <div>
                <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Очередь n8n</p>
                <h3 class="text-2xl font-bold text-slate-800 mt-1">0</h3>
            </div>
            <div class="p-2 bg-emerald-50 rounded-lg text-emerald-600"><i class="ph ph-rocket-launch text-xl"></i></div>
        </div>
        <p class="text-xs text-emerald-600 mt-2">Все системы в норме</p>
    </div>
</div>

<!-- Блок быстрых действий -->
<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
    <h3 class="text-lg font-semibold text-slate-800 mb-4">Быстрые действия</h3>
    <div class="flex gap-4">
        <button hx-post="/api/actions/sync" hx-swap="none" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex items-center gap-2">
            <i class="ph ph-arrows-clockwise"></i> Синхронизировать Redmine
        </button>
        <button class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition flex items-center gap-2">
            <i class="ph ph-trash"></i> Очистить кэш
        </button>
    </div>
</div>
{% endblock %}
