<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority Desk</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Иконки (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        [x-cloak] { display: none !important; }
        /* Стили для скроллбара */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden">

<!-- 🟦 SIDEBAR (Боковое меню) -->
<aside class="w-64 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 transition-all duration-300">
    <!-- Логотип -->
    <div class="h-16 flex items-center px-6 border-b border-slate-100">
        <i class="ph-fill ph-hexagon text-blue-600 text-2xl mr-3"></i>
        <span class="font-bold text-lg tracking-tight">Priority Desk</span>
    </div>

    <!-- Навигация -->
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a href="/domains" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md
               {% if request.url.path == '/domains' %}bg-blue-50 text-blue-700{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
            <i class="ph ph-globe text-lg"></i> Сферы
        </a>
        <a href="/logs" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md
               {% if request.url.path == '/logs' %}bg-blue-50 text-blue-700{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
            <i class="ph ph-scroll text-lg"></i> Логи
        </a>
        <a href="/settings" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md
               {% if request.url.path == '/settings' %}bg-blue-50 text-blue-700{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
            <i class="ph ph-gear text-lg"></i> Настройки
        </a>
    </nav>

    <!-- Профиль пользователя -->
    <div class="p-4 border-t border-slate-100">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs">A</div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-slate-900 truncate">Admin</p>
                <p class="text-xs text-slate-500 truncate">admin@local</p>
            </div>
            <a href="/logout" class="text-slate-400 hover:text-red-500 transition">
                <i class="ph ph-sign-out text-xl"></i>
            </a>
        </div>
    </div>
</aside>

<!-- 🟦 MAIN CONTENT -->
<main class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Верхняя шапка (мобильная или для заголовков) -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
        <h2 class="text-xl font-semibold text-slate-800 capitalize">
            {% block page_title %}Dashboard{% endblock %}
        </h2>
    </header>

    <!-- Область контента -->
    <div class="flex-1 overflow-y-auto p-6">
        {% block content %}
        <!-- Сюда вставляется контент страниц -->
        {% endblock %}
    </div>
</main>

<!-- Контейнер для Toast-уведомлений -->
<div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

<!-- Скрипт для тостов -->
<script>
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.successful) {
            try {
                const response = evt.detail.xhr.responseText;
                if (response.includes('✅') || response.includes('success')) {
                    showToast(response.replace(/<[^>]*>/g, ''), 'success');
                } else if (response.includes('❌')) {
                    showToast(response.replace(/<[^>]*>/g, ''), 'error');
                }
            } catch (e) {}
        }
    });

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bg = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
        toast.className = `${bg} text-white px-4 py-3 rounded shadow-lg text-sm font-medium flex items-center gap-2 animate-fade-in-up`;
        toast.innerHTML = `<span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }
</script>
</body>
</html>
