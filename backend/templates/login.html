<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Priority Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-6 text-slate-800">Priority Desk</h1>

    {% if error %}
    <div class="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm text-center border border-red-200">
        Неверный логин или пароль
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Логин</label>
            <input type="text" name="username" required autocomplete="username"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
            <input type="password" name="password" required autocomplete="current-password"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>
        <button type="submit" class="w-full py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 active:bg-blue-800 transition shadow-sm">
            Войти
        </button>
    </form>
</div>
</body>
</html>
